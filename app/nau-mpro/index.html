<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nau Mpro</title>
    <meta name="description" content="Hymns of Montagnard Bunong Alliance Church, to read on your phone or computer. Works offline." />
    <link rel="icon" type="image/png" sizes="192x192" href="/nau-mpro/icon-192.png" />
    <link rel="manifest" href="/nau-mpro/manifest.webmanifest" />
    <meta name="theme-color" content="#C9541F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nau Mpro" />
    <link rel="apple-touch-icon" href="/nau-mpro/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" />
    <script>
      // The reader's own light/dark choice (light unless chosen), set before the page paints
      (function () {
        var t = "light";
        try { if (localStorage.getItem("readerTheme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/reader/main.tsx"></script>
  </body>
</html>
