<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector View</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; }
  /* The stage is a 16:9 box that fits the window. Font sizes are in container units,
     so the slide looks the same at any screen size. */
  .stage {
    position: relative;
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    overflow: hidden;
  }
  .text {
    position: absolute;
    inset: 0;
    padding: 4.5%;              /* 0.6 in margin, the same as the downloaded file */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: pre-line;
    font-weight: 700;
    line-height: 1.3;
    font-size: calc(var(--size) / 960 * 100cqw);   /* 960 pt = slide width */
  }
  .tag {
    white-space: pre-line; text-align: right; line-height: 1.2;
    position: absolute;
    bottom: 4%;
    right: 4.5%;
    font-weight: 700;
    font-size: calc(28 / 960 * 100cqw);
  }
  .counter {
    position: fixed;
    right: 12px;
    bottom: 8px;
    color: #888;
    font: 13px Arial, sans-serif;
    opacity: .6;
  }
  .vnum { font-size: .5em; font-weight: 700; line-height: 0; vertical-align: .7em; }
  /* Bible study decks: the text stops above the reference label, as in the downloaded file */
  .stage.reserve .text { padding-bottom: 10.1%; }
  .stage.reserve .text { padding-left: 1.9%; padding-right: 1.9%; }
  .stage.reserve .tag { bottom: 8%; right: 1.9%; }
  .message { color: #ddd; font: 18px Arial, sans-serif; padding: 24px; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div class="counter" id="counter"></div>

<script>
(() => {
  const app = document.getElementById("app");
  const counter = document.getElementById("counter");
  let deck = null;
  let index = 0;
  let blackout = false;

  // The lyrics page saves the deck here when you press "Open projector view"
  try {
    deck = JSON.parse(localStorage.getItem("lyricsDeck") || "null");
  } catch (_) { deck = null; }

  if (!deck || !deck.slides || !deck.slides.length) {
    app.innerHTML = '<p class="message">No slides yet. Go to the lyrics page, paste the song, then press "Open projector view".</p>';
    return;
  }

  // Passage lines: verse numbers (marked with \u0001) are drawn smaller and in the verse-number color,
  // inline. Other slides (lyrics, titles, questions) are drawn as plain text.
  // Each line is a list of segments with their own formatting (bold, underline, color)
  function fillText(el, segsPerLine, numColor) {
    segsPerLine.forEach((segs, i) => {
      if (i) el.append("\n");
      segs.forEach((seg, j) => {
        if (j && !segs[j - 1].text.startsWith("\u0001")) el.append(" ");
        const span = document.createElement("span");
        if (seg.f) {
          span.style.fontWeight = seg.f.bold ? "700" : "400";
          if (seg.f.italic) span.style.fontStyle = "italic";
          if (seg.f.underline) span.style.textDecoration = "underline";
          if (seg.f.color) span.style.color = seg.f.color;
        }
        const parts = numColor ? seg.text.split(/\u0001(\d{1,3})/) : [seg.text.replace(/\u0001/g, "")];
        parts.forEach((part, k) => {
          if (k % 2) {
            const n = document.createElement("span");
            n.className = "vnum";
            n.style.color = numColor;
            n.textContent = part + " ";
            span.append(n);
          } else if (part) {
            span.append(k ? part.replace(/^ /, "") : part);
          }
        });
        el.append(span);
      });
    });
  }

  function show() {
    if (blackout) {
      app.innerHTML = "";
      app.style.background = "#000";
      counter.textContent = "";
      return;
    }
    const slide = deck.slides[index];
    const stage = document.createElement("div");
    stage.className = "stage";
    stage.style.background = deck.bg;
    stage.style.color = deck.fg;
    stage.style.fontFamily = `${deck.font}, Arial, sans-serif`;
    if (deck.reserve) stage.classList.add("reserve");

    const text = document.createElement("div");
    text.className = "text";
    text.style.setProperty("--size", slide.size || deck.size);
    // One block holds the text, so the flex centering stacks the lines instead of setting pieces side by side
    const body = document.createElement("div");
    body.style.width = "100%";
    body.style.textAlign = slide.align || "center";
    // Lyrics decks have no segments, so each line becomes one plain segment
    const lines = slide.segs || slide.rows.map((r) => [{ text: r, f: null }]);
    fillText(body, lines, slide.verse ? (deck.numColor || "#f2c14e") : null);
    text.appendChild(body);
    // Stacked titles grow up from the corner, so the text stops above them
    if (deck.padBottomPct) text.style.paddingBottom = `${deck.padBottomPct}%`;
    stage.appendChild(text);

    if (slide.label && deck.showLabels) {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = slide.label;
      // Verse labels (V1, V2) are soft so they don't compete with the words
      if (slide.label.startsWith("V")) tag.style.opacity = 0.65;
      // Bible study decks set their own slide-title size and fade
      if (deck.tagPt) {
        tag.style.fontSize = `calc(${deck.tagPt} / 960 * 100cqw)`;
        tag.style.opacity = deck.tagOpacity;
        tag.style.textTransform = "uppercase";
      }
      stage.appendChild(tag);
    }

    app.innerHTML = "";
    app.appendChild(stage);
    counter.textContent = `${index + 1} / ${deck.slides.length}`;
  }

  function go(delta) {
    index = Math.min(deck.slides.length - 1, Math.max(0, index + delta));
    blackout = false;
    show();
  }

  document.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "ArrowRight": case "ArrowDown": case "PageDown": case " ": case "Enter":
        e.preventDefault(); go(1); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp": case "Backspace":
        e.preventDefault(); go(-1); break;
      case "Home": index = 0; blackout = false; show(); break;
      case "End": index = deck.slides.length - 1; blackout = false; show(); break;
      case "b": case "B": blackout = !blackout; show(); break;
      case "f": case "F":
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
        break;
    }
  });

  // Click or tap the slide to go to the next one
  app.addEventListener("click", () => go(1));

  show();
})();
</script>
</body>
</html>
